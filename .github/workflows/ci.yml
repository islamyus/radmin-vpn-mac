name: macOS checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Runner context is available in steps, not in job-level env expressions.
      # Keep upstream Unix-socket fixture paths below Darwin's short path limit.
      - name: Select short private temporary directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: '1.95.0'
      - name: Check temporary directory
        run: test -d "$TMPDIR"
      - name: Check public source
        run: python3 scripts/check-public-source.py
      - name: Swift tests
        run: swift test
      - name: Native frontend tests
        run: cargo test --manifest-path native/Cargo.toml --locked
      - name: OpenRad library tests
        run: cargo test --manifest-path vendor/openrad/Cargo.toml --lib --locked
      - name: Build signed application
        run: zsh scripts/build-app.sh
      - name: Isolated Keychain and loopback fixtures
        run: |
          python3 scripts/test-identity-helper.py
          python3 scripts/test-network-probe.py
