[package]
name = "radmin-mac-engine"
version = "0.3.3"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-only"

[workspace]

[dependencies]
openrad-client = { path = "../vendor/openrad" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
libc = "0.2"
security-framework = "3.7"
sha2 = "0.10"
rand = "0.8"
socket2 = "0.6"

[[bin]]
name = "radmin-network-test"
path = "src/network_test.rs"
